name: Build LiroOS ISO

on:
  workflow_dispatch:
    inputs:
      mint_iso_url:
        description: "Official Linux Mint XFCE ISO download URL"
        required: true
        type: string
      mint_iso_sha256:
        description: "Published SHA256 checksum of that exact ISO"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build customized live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate build script syntax
        run: bash -n ./build-iso.sh

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Replace runner mirror configuration with a different public Ubuntu mirror.
          # The previous run showed DNS failures for archive.ubuntu.com.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://mirrors.edge.kernel.org/ubuntu
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/sources.list
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 update
          # Install xorriso from the official Ubuntu 24.04 package archive.
          curl --fail --location --retry 3 \
            https://es.archive.ubuntu.com/ubuntu/pool/main/libi/libisoburn/xorriso_1.5.6-1.1ubuntu3_amd64.deb \
            -o /tmp/xorriso.deb
          echo "7a0644fc4bc269d22ce8d27bd39e14b5849b532097265161938a9b216468f84d  /tmp/xorriso.deb" | sha256sum --check -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 install -y \
            /tmp/xorriso.deb squashfs-tools rsync curl

      - name: Download and verify Linux Mint XFCE
        env:
          ISO_URL: ${{ inputs.mint_iso_url }}
          ISO_SHA256: ${{ inputs.mint_iso_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$ISO_URL" -o linuxmint-xfce.iso
          echo "$ISO_SHA256  linuxmint-xfce.iso" | sha256sum --check -

      - name: Build LiroOS
        run: sudo bash ./build-iso.sh "$GITHUB_WORKSPACE/linuxmint-xfce.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiroOS-ISO
          path: |
            build/LiroOS-*.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

name: Build LiroOS ISO

on:
  workflow_dispatch:
    inputs:
      mint_iso_url:
        description: "Official Linux Mint XFCE ISO download URL"
        required: true
        type: string
      mint_iso_sha256:
        description: "Published SHA256 checksum of that exact ISO"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build customized live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate build script syntax
        run: bash -n ./build-iso.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools rsync curl

      - name: Download and verify Linux Mint XFCE
        env:
          ISO_URL: ${{ inputs.mint_iso_url }}
          ISO_SHA256: ${{ inputs.mint_iso_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$ISO_URL" -o linuxmint-xfce.iso
          echo "$ISO_SHA256  linuxmint-xfce.iso" | sha256sum --check -

      - name: Build LiroOS
        run: sudo bash ./build-iso.sh "$GITHUB_WORKSPACE/linuxmint-xfce.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiroOS-ISO
          path: |
            build/LiroOS-*.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
